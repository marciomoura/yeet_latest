# Name of the workflow that appears in GitHub Actions
name: CI

# Workflow version: 2.1 - Added embedded target builds (2025-10-10)

# Define when this workflow will run
on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      run_formatter:
        description: "Run the code formatting job?"
        required: false
        type: boolean
        default: false
      run_valgrind:
        description: "Run Valgrind memory checks?"
        required: false
        type: boolean
        default: false
      build_embedded:
        description: "Build embedded targets?"
        required: false
        type: boolean
        default: true

jobs:
  # Job 1: Code formatting check (fast, runs on manual trigger or PRs)
  # format:
  #   if: github.event.inputs.run_formatter == 'true' || github.event_name == 'pull_request'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v2

  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.x"

  #     - name: Install formatters
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install cmake-format pyyaml
  #         sudo apt-get update
  #         sudo apt-get install -y clang-format

  #     - name: Check CMake formatting
  #       run: |
  #         find . -name "CMakeLists.txt" -o -name "*.cmake" | \
  #         xargs -P $(nproc) -I {} bash -c "echo 'Checking {}' && cmake-format --check '{}'"

  #     - name: Check C++ formatting
  #       run: |
  #         find . -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | \
  #         xargs -P $(nproc) -I {} bash -c "echo 'Checking {}' && clang-format --dry-run --Werror '{}'"

  # Job 2: Build (shared by all other jobs)
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [clang, gcc]
    steps:
      - name: Print Runner Information
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"
          echo "Available CPUs: $(nproc)"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Branch: $GITHUB_REF"
          echo "Compiler: ${{ matrix.compiler }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: cmake ninja-build clang gcc g++ ccache mold gcovr llvm
          version: 1.0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.compiler }}-ccache
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-
            ${{ runner.os }}-
          max-size: 500M
          verbose: 2

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/CMakeCache.txt
            build/CMakeFiles
          key: ${{ runner.os }}-${{ matrix.compiler }}-cmake-${{ hashFiles('**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-cmake-
            ${{ runner.os }}-cmake-

      - name: Set compiler variables
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi

      - name: Configure CMake project
        run: |
          cmake -G Ninja -B build \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=$CC \
                -DCMAKE_CXX_COMPILER=$CXX \
                -DCMAKE_LINKER_TYPE=MOLD \
                -DYEET_BUILD_TESTING=ON \
                -DYEET_CODE_COVERAGE=ON \
                -DYEET_MEMCHECK=ON \
                -DYEET_ENABLE_DATA_LOGGING=OFF \
                -DYEET_ENABLE_CCACHE=ON
          echo "=== CMake Configuration Complete ==="

      - name: Build all test targets
        run: |
          echo "=== Starting Build at $(date) ==="
          time cmake --build build --parallel $(nproc) --target \
            yeet_test \
            yeet_testing_tests \
            yeet_control_tests \
            yeet_application_sfc_tests \
            yeet_application_sfc_integration_tests
          echo "=== Build Complete at $(date) ==="

      - name: Show ccache statistics
        run: |
          echo "=== CCCache Statistics ==="
          ccache -s
          echo "=== CCCache Configuration ==="
          ccache -p

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-binaries-${{ matrix.compiler }}
          path: |
            build/bin/yeet_test
            build/bin/yeet_testing_tests
            build/bin/yeet_control_tests
            build/bin/yeet_application_sfc_tests
            build/bin/yeet_application_sfc_integration_tests
          retention-days: 3
          compression-level: 9

  # Job 3: Build Embedded Targets (ARM Cortex-M4)
  # Builds firmware for STM32F407 targets (CN board and Discovery board)
  # Both GRID and MACHINE side controllers are built in Release mode only
  # ARM toolchain is cached globally and only downloaded once per cache period
  # 
  # Requirements:
  # - gcc-arm-none-eabi toolchain with LTO support (gcc-ar, gcc-ranlib)
  # - If LTO tools are missing, builds will fall back to standard ar/ranlib
  # - LTO (Link Time Optimization) is enabled for smaller binaries
  build-embedded:
    if: github.event.inputs.build_embedded != 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [stm32f407zg-cn, stm32f407g-disc1]
        side: [GRID, MACHINE]
      fail-fast: false
    steps:
      - name: Print Build Configuration
        run: |
          echo "Building embedded target:"
          echo "  Board: ${{ matrix.board }}"
          echo "  Side: ${{ matrix.side }}"
          echo "  Build Type: Release"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache APT packages (base tools)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: cmake ninja-build ccache wget xz-utils
          version: 1.0

      - name: Cache ARM GCC Toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/arm-toolchain
          key: arm-toolchain-13.3.rel1

      - name: Install ARM GCC Toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "=== Installing ARM GCC Toolchain ==="
          
          # Download the official ARM GCC toolchain (same version as STM32CubeCLT)
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          
          # Extract to /opt
          sudo mkdir -p /opt/arm-toolchain
          sudo tar -xf arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz -C /opt/arm-toolchain --strip-components=1
          
          # Cleanup download
          rm arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          
          echo "=== ARM Toolchain Installation Complete ==="

      - name: Add ARM Toolchain to PATH and configure environment
        run: |
          # Export PATH immediately for this step and all subsequent steps
          echo "/opt/arm-toolchain/bin" >> $GITHUB_PATH
          export PATH="/opt/arm-toolchain/bin:$PATH"
          
          # Set GCC_TOOLCHAIN_ROOT environment variable
          TOOLCHAIN_ROOT="/opt/arm-toolchain"
          echo "GCC_TOOLCHAIN_ROOT=$TOOLCHAIN_ROOT" >> $GITHUB_ENV
          
          echo "Setting GCC_TOOLCHAIN_ROOT to: $TOOLCHAIN_ROOT"
          
          # Verify installation
          echo ""
          echo "=== ARM GCC Toolchain Information ==="
          arm-none-eabi-gcc --version
          TOOLCHAIN_PATH=$(which arm-none-eabi-gcc)
          echo "Toolchain found at: $TOOLCHAIN_PATH"
          ls -l $TOOLCHAIN_PATH
          
          # Verify nano.specs exists
          echo ""
          echo "=== Verifying nano.specs ==="
          NANO_SPECS=$(find $TOOLCHAIN_ROOT -name "nano.specs" | head -1)
          if [ -n "$NANO_SPECS" ]; then
            echo "✅ nano.specs found at: $NANO_SPECS"
          else
            echo "❌ nano.specs NOT FOUND - builds will fail!"
            exit 1
          fi
          
          # Verify LTO-aware tools are available
          echo ""
          echo "=== Verifying LTO-aware tools ==="
          if command -v arm-none-eabi-gcc-ar >/dev/null 2>&1; then
            echo "✅ arm-none-eabi-gcc-ar found"
          else
            echo "⚠️  arm-none-eabi-gcc-ar not found"
          fi

      - name: Setup ccache for embedded
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-arm-${{ matrix.board }}-${{ matrix.side }}-release-ccache
          restore-keys: |
            ${{ runner.os }}-arm-${{ matrix.board }}-${{ matrix.side }}-
            ${{ runner.os }}-arm-${{ matrix.board }}-
            ${{ runner.os }}-arm-
          max-size: 300M
          verbose: 2

      - name: Cache CMake dependencies (embedded)
        uses: actions/cache@v4
        with:
          path: |
            build-embedded-*/_deps
            build-embedded-*/CMakeCache.txt
            build-embedded-*/CMakeFiles
          key: ${{ runner.os }}-arm-${{ matrix.board }}-${{ matrix.side }}-cmake-${{ hashFiles('**/CMakeLists.txt', 'cmake/**/*.cmake', 'boards/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-arm-${{ matrix.board }}-${{ matrix.side }}-cmake-
            ${{ runner.os }}-arm-cmake-

      - name: Configure embedded CMake project
        run: |
          PRESET_NAME="embedded-$(echo ${{ matrix.board }} | sed 's/stm32f407g-disc1/disc1/' | sed 's/stm32f407zg-cn/cn/')-$(echo ${{ matrix.side }} | tr '[:upper:]' '[:lower:]')"
          echo "Using CMake preset: $PRESET_NAME"
          echo ""
          cmake --preset=$PRESET_NAME
          echo ""
          echo "=== Embedded CMake Configuration Complete ==="
          
          # Check for LTO tool warnings
          if grep -q "LTO-aware tools" build-embedded-*/CMakeFiles/CMakeOutput.log 2>/dev/null || \
             grep -q "LTO-aware" build-embedded-*/CMakeFiles/CMakeError.log 2>/dev/null; then
            echo "⚠️  Note: Check CMake logs for LTO tool availability"
          fi

      - name: Build embedded target (Release)
        run: |
          echo "=== Starting Embedded Build at $(date) ==="
          PRESET_NAME="embedded-$(echo ${{ matrix.board }} | sed 's/stm32f407g-disc1/disc1/' | sed 's/stm32f407zg-cn/cn/')-$(echo ${{ matrix.side }} | tr '[:upper:]' '[:lower:]')-release"
          echo "Using build preset: $PRESET_NAME"
          time cmake --build --preset=$PRESET_NAME --parallel $(nproc)
          echo "=== Embedded Build Complete at $(date) ==="

      - name: Show build artifacts and memory usage
        run: |
          BOARD_SHORT=$(echo ${{ matrix.board }} | sed 's/stm32f407g-disc1/disc1/' | sed 's/stm32f407zg-cn/cn/')
          SIDE_LOWER=$(echo ${{ matrix.side }} | tr '[:upper:]' '[:lower:]')
          BUILD_DIR="build-embedded-${BOARD_SHORT}-${SIDE_LOWER}"
          
          echo "=== Build Artifacts ==="
          ls -lh ${BUILD_DIR}/bin/Release/*.elf || true
          ls -lh ${BUILD_DIR}/bin/Release/*.bin || true
          ls -lh ${BUILD_DIR}/bin/Release/*.hex || true
          
          echo ""
          echo "=== Flash Memory Usage ==="
          if [ -f "${BUILD_DIR}/bin/Release/yeet_embedded_app_${SIDE_LOWER}.elf" ]; then
            arm-none-eabi-size ${BUILD_DIR}/bin/Release/yeet_embedded_app_*.elf
          fi

      - name: Show ccache statistics
        run: |
          echo "=== CCCache Statistics (Embedded) ==="
          ccache -s

      - name: Upload embedded binaries
        uses: actions/upload-artifact@v4
        with:
          name: embedded-${{ matrix.board }}-${{ matrix.side }}-release
          path: |
            build-embedded-*/bin/Release/*.elf
            build-embedded-*/bin/Release/*.bin
            build-embedded-*/bin/Release/*.hex
            build-embedded-*/bin/Release/*.map
          retention-days: 7
          compression-level: 6

  # Job 4: Unit Tests (fast tests)
  test-unit:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [clang, gcc]
      fail-fast: false
    steps:
      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries-${{ matrix.compiler }}
          path: build/bin/

      - name: Make binaries executable
        run: chmod +x build/bin/*

      - name: Run unit tests in parallel
        run: |
          echo "=== Running Unit Tests with ${{ matrix.compiler }} ==="
          ./build/bin/yeet_test --gtest_color=yes &
          PID1=$!
          ./build/bin/yeet_testing_tests --gtest_color=yes &
          PID2=$!
          ./build/bin/yeet_control_tests --gtest_color=yes &
          PID3=$!
          
          # Wait for all tests and capture exit codes
          wait $PID1
          EXIT1=$?
          wait $PID2
          EXIT2=$?
          wait $PID3
          EXIT3=$?
          
          # Exit with failure if any test failed
          if [ $EXIT1 -ne 0 ] || [ $EXIT2 -ne 0 ] || [ $EXIT3 -ne 0 ]; then
            echo "One or more tests failed!"
            exit 1
          fi
          echo "All unit tests passed! ✅"

  # Job 5: Integration Tests (slower tests)
  test-integration:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [clang, gcc]
      fail-fast: false
    steps:
      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries-${{ matrix.compiler }}
          path: build/bin/

      - name: Make binaries executable
        run: chmod +x build/bin/*

      - name: Run integration tests in parallel
        run: |
          echo "=== Running Integration Tests with ${{ matrix.compiler }} ==="
          ./build/bin/yeet_application_sfc_tests --gtest_color=yes &
          PID1=$!
          ./build/bin/yeet_application_sfc_integration_tests --gtest_color=yes &
          PID2=$!
          
          # Wait for all tests and capture exit codes
          wait $PID1
          EXIT1=$?
          wait $PID2
          EXIT2=$?
          
          # Exit with failure if any test failed
          if [ $EXIT1 -ne 0 ] || [ $EXIT2 -ne 0 ]; then
            echo "One or more tests failed!"
            exit 1
          fi
          echo "All integration tests passed! ✅"

