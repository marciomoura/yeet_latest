# Name of the workflow that appears in GitHub Actions
name: CI

# Define when this workflow will run
on:
  push: # Keep existing triggers if needed
  pull_request: # Keep existing triggers if needed
  workflow_dispatch: # Add manual trigger
    inputs:
      run_formatter:
        description: "Run the code formatting job?"
        required: false
        type: boolean
        default: false # Default is to run the formatter

jobs:
  format:
    # Run formatter job if enabled
    if: github.event.inputs.run_formatter == 'true'
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code
      - uses: actions/checkout@v2

      # Set up Python environment needed for cmake-format
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Install required Python packages and clang-format
      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          pip install cmake-format pyyaml
          sudo apt-get update
          sudo apt-get install -y clang-format

      # Run cmake-format on all CMake files in parallel
      - name: Check CMake formatting
        run: |
          find . -name "CMakeLists.txt" -o -name "*.cmake" | \
          xargs -P $(nproc) -I {} bash -c "echo 'Checking {}' && cmake-format --check '{}'"

      # Run clang-format on all C++ files in parallel
      - name: Check C++ formatting
        run: |
          find . -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | \
          xargs -P $(nproc) -I {} bash -c "echo 'Checking {}' && clang-format --dry-run --Werror '{}'"

  # Second job: Build and test the project
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print Runner Information
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"
          echo "Available CPUs: $(nproc)"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Branch: $GITHUB_REF"

      - name: Checkout code
        uses: actions/checkout@v2

      # Cache APT packages to speed up dependency installation
      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake ninja-build clang valgrind llvm gcovr ccache mold
          version: 1.0

      # Setup ccache for faster C/C++ compilation
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.ref }}-ccache
          max-size: 500M

      # Cache CMake FetchContent dependencies
      - name: Cache CMake dependencies
        uses: actions/cache@v3
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cmake/dependencies/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: Set up CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang valgrind llvm gcovr ccache mold

      - name: Configure CMake project
        run: |
          cmake -G Ninja -B build \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_LINKER_TYPE=MOLD \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DYEET_BUILD_TESTING=ON \
                -DYEET_CODE_COVERAGE=ON \
                -DYEET_MEMCHECK=ON \
                -DYEET_ENABLE_DATA_LOGGING=OFF
          echo "=== CMake Configuration Complete ==="
          echo "Data logging should be: OFF"

      - name: Build targets
        run: |
          cmake --build build --parallel $(nproc) --target \
            yeet_test \
            yeet_testing_tests \
            yeet_control_tests \
            yeet_application_sfc_tests \
            yeet_application_sfc_integration_tests

      - name: Show ccache statistics
        run: ccache -s
            
      - name: Run tests in parallel
        run: |
          cd build
          ctest --output-on-failure \
                --parallel $(nproc) \
                --timeout 300 \
                --progress
        env:
          GTEST_COLOR: 1

      - name: Re-run failed tests verbosely
        if: failure()
        run: |
          cd build
          ctest --rerun-failed --verbose --output-on-failure

      - name: Generate and check coverage
        run: |
          mkdir -p coverage
          gcovr --gcov-executable "llvm-cov gcov" \
                --print-summary \
                --fail-under-line 80 \
                --exclude ".*build.*" \
                --exclude ".*_deps.*" \
                --exclude ".*tests.*" \
                --html --html-details \
                --output coverage/index.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Run Valgrind Memory Check
        run: |
          valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-reachable=yes \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   --show-leak-kinds=all \
                   --verbose \
                   ./build/bin/yeet_test 2> valgrind.log
        continue-on-error: true

      - name: Upload Valgrind logs
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs
          path: valgrind.log
        if: always() # Upload even if tests fail

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # Cancel old runs when new commits are pushed

env:
  GTEST_COLOR: 1
  CCACHE_DIR: /home/runner/.ccache
