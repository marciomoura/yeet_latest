  # Job 7: Memory Check with Valgrind (optional, slow)
  valgrind:
    if: github.event.inputs.run_valgrind == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download test binaries (Clang only)
        uses: actions/download-artifact@v4
        with:
          name: test-binaries-clang
          path: build/bin/

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: valgrind
          version: 1.0

      - name: Make binaries executable
        run: chmod +x build/bin/*

      - name: Run Valgrind on core tests
        run: |
          valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-reachable=yes \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   --show-leak-kinds=all \
                   --suppressions=.valgrind-suppressions \
                   ./build/bin/yeet_test 2>&1 | tee valgrind-core.log
        continue-on-error: true

      - name: Run Valgrind on control tests
        run: |
          valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-reachable=yes \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   --show-leak-kinds=all \
                   --suppressions=.valgrind-suppressions \
                   ./build/bin/yeet_control_tests 2>&1 | tee valgrind-control.log
        continue-on-error: true

      - name: Upload Valgrind logs
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs
          path: |
            valgrind-*.log
          retention-days: 7
        if: always()

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GTEST_COLOR: 1
