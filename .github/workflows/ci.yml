  #         xargs -P $(nproc) -I {} bash -c "echo 'Checking {}' && clang-format --dry-run --Werror '{}'"

  # Job 2: Build (shared by all other jobs)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print Runner Information
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"
          echo "Available CPUs: $(nproc)"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Branch: $GITHUB_REF"

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: cmake ninja-build clang ccache mold gcovr llvm valgrind
          version: 1.0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.ref }}-ccache
          max-size: 500M

      - name: Cache CMake dependencies
        uses: actions/cache@v3
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('cmake/dependencies/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: Set up CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang ccache mold gcovr llvm valgrind

      - name: Configure CMake project
        run: |
          cmake -G Ninja -B build \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_LINKER_TYPE=MOLD \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DYEET_BUILD_TESTING=ON \
                -DYEET_CODE_COVERAGE=ON \
                -DYEET_MEMCHECK=ON \
                -DYEET_ENABLE_DATA_LOGGING=OFF
          echo "=== CMake Configuration Complete ==="

      - name: Build all test targets
        run: |
          cmake --build build --parallel $(nproc) --target \
            yeet_test \
            yeet_testing_tests \
            yeet_control_tests \
            yeet_application_sfc_tests \
            yeet_application_sfc_integration_tests

      - name: Show ccache statistics
        run: ccache -s

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 1

  # Job 3: Unit Tests (fast tests)
  test-unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Make binaries executable
        run: chmod +x build/bin/*

      - name: Run yeet_test
        run: ./build/bin/yeet_test
        env:
          GTEST_COLOR: 1

      - name: Run yeet_testing_tests
        run: ./build/bin/yeet_testing_tests
        env:
          GTEST_COLOR: 1

      - name: Run yeet_control_tests
        run: ./build/bin/yeet_control_tests
        env:
          GTEST_COLOR: 1

  # Job 4: Integration Tests (slower tests)
  test-integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Make binaries executable
        run: chmod +x build/bin/*

      - name: Run yeet_application_sfc_tests
        run: ./build/bin/yeet_application_sfc_tests
        env:
          GTEST_COLOR: 1

      - name: Run yeet_application_sfc_integration_tests
        run: ./build/bin/yeet_application_sfc_integration_tests
        env:
          GTEST_COLOR: 1

  # Job 5: Code Coverage (runs after tests)
  # coverage:
  #   needs: [test-unit, test-integration]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v2

  #     - name: Download build artifacts
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: build-artifacts
  #         path: build/

  #     - name: Install gcovr
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y gcovr llvm

  #     - name: Make binaries executable
  #       run: chmod +x build/bin/*

  #     - name: Run all tests to generate coverage data
  #       run: |
  #         cd build
  #         ctest --output-on-failure --parallel $(nproc)
  #       continue-on-error: true
  #       env:
  #         GTEST_COLOR: 1

  #     - name: Generate coverage report
  #       run: |
  #         mkdir -p coverage
  #         gcovr --gcov-executable "llvm-cov gcov" \
  #               --print-summary \
  #               --fail-under-line 80 \
  #               --exclude ".*build.*" \
  #               --exclude ".*_deps.*" \
  #               --exclude ".*tests.*" \
  #               --html --html-details \
  #               --output coverage/index.html

  #     - name: Upload coverage report
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: coverage-report
  #         path: coverage/

  # Job 6: Memory Check with Valgrind
  valgrind:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Make binaries executable
        run: chmod +x build/bin/*

      - name: Run Valgrind on core tests
        run: |
          valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-reachable=yes \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   --show-leak-kinds=all \
                   --verbose \
                   ./build/bin/yeet_test 2>&1 | tee valgrind-core.log
        continue-on-error: true

      - name: Run Valgrind on control tests
        run: |
          valgrind --tool=memcheck \
                   --leak-check=full \
                   --show-reachable=yes \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   --show-leak-kinds=all \
                   --verbose \
                   ./build/bin/yeet_control_tests 2>&1 | tee valgrind-control.log
        continue-on-error: true

      - name: Upload Valgrind logs
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs
          path: |
            valgrind-*.log
        if: always()

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GTEST_COLOR: 1
  CCACHE_DIR: /home/runner/.ccache
